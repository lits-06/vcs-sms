definitions:
  github_com_lits-06_vcs-sms_user_service_internal_dto.AddUserScopeRequest:
    properties:
      email:
        example: user@example.com
        type: string
      scopes:
        example:
        - server:view
        - server:create
        items:
          type: string
        type: array
    required:
    - email
    - scopes
    type: object
  github_com_lits-06_vcs-sms_user_service_internal_dto.RegisterRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: password123
        minLength: 6
        type: string
      username:
        example: john_doe
        type: string
    required:
    - email
    - password
    - username
    type: object
  github_com_lits-06_vcs-sms_user_service_internal_dto.RemoveUserScopeRequest:
    properties:
      email:
        example: user@example.com
        type: string
      scopes:
        example:
        - server:view
        items:
          type: string
        type: array
    required:
    - email
    - scopes
    type: object
  httpresponse.Response:
    properties:
      data: {}
      message:
        type: string
    type: object
host: user.localhost
info:
  contact: {}
  description: This is the User Service API for VCS-SMS system
  title: User Service API
  version: "1.0"
paths:
  /api/users/register:
    post:
      consumes:
      - application/json
      description: Register a new user with email, username and password
      parameters:
      - description: Register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_lits-06_vcs-sms_user_service_internal_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User registered successfully
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "500":
          description: Failed to register user
          schema:
            $ref: '#/definitions/httpresponse.Response'
      summary: Register a new user
      tags:
      - User
  /api/users/scopes:
    delete:
      consumes:
      - application/json
      description: Remove one or more scopes from a user by email
      parameters:
      - description: Remove user scope request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_lits-06_vcs-sms_user_service_internal_dto.RemoveUserScopeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User scope removed successfully
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "500":
          description: Failed to remove user scope
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - BearerAuth: []
      summary: Remove scopes from user
      tags:
      - User
    post:
      consumes:
      - application/json
      description: Add one or more scopes to a user by email
      parameters:
      - description: Add user scope request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_lits-06_vcs-sms_user_service_internal_dto.AddUserScopeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User scope added successfully
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "500":
          description: Failed to add user scope
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - BearerAuth: []
      summary: Add scopes to user
      tags:
      - User
  /health:
    get:
      description: Get health status of the User Service
      produces:
      - application/json
      responses:
        "200":
          description: Service is running
          schema:
            $ref: '#/definitions/httpresponse.Response'
      summary: Health check
      tags:
      - Health
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"

definitions:
  dto.AddUserScopeRequest:
    properties:
      email:
        example: user@example.com
        type: string
      scopes:
        example:
        - server:view
        - server:create
        items:
          type: string
        type: array
    required:
    - email
    - scopes
    type: object
  dto.RegisterRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: password123
        minLength: 6
        type: string
      username:
        example: john_doe
        type: string
    required:
    - email
    - password
    - username
    type: object
  dto.RemoveUserScopeRequest:
    properties:
      email:
        example: user@example.com
        type: string
      scopes:
        example:
        - server:view
        items:
          type: string
        type: array
    required:
    - email
    - scopes
    type: object
info:
  contact: {}
paths:
  /register:
    post:
      consumes:
      - application/json
      description: Register a new user with email, username and password
      parameters:
      - description: Register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User registered successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to register user
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - User
  /user/scopes:
    delete:
      consumes:
      - application/json
      description: Remove one or more scopes from a user by email
      parameters:
      - description: Remove user scope request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RemoveUserScopeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User scope removed successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to remove user scope
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Remove scopes from user
      tags:
      - User
    post:
      consumes:
      - application/json
      description: Add one or more scopes to a user by email
      parameters:
      - description: Add user scope request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AddUserScopeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User scope added successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to add user scope
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Add scopes to user
      tags:
      - User
swagger: "2.0"

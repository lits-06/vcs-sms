definitions:
  github_com_lits-06_vcs-sms_report_service_internal_dto.UptimeRequest:
    properties:
      email:
        type: string
      end_date:
        type: string
      start_date:
        type: string
    required:
    - email
    - end_date
    - start_date
    type: object
  httpresponse.Response:
    properties:
      data: {}
      message:
        type: string
    type: object
host: report.localhost
info:
  contact: {}
  description: API for generating and managing uptime reports
  title: Report Service API
  version: "1.0"
paths:
  /api/reports:
    post:
      consumes:
      - application/json
      description: Create uptime report for specific date range and send via email
      parameters:
      - description: Report request payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_lits-06_vcs-sms_report_service_internal_dto.UptimeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Report created successfully
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httpresponse.Response'
      security:
      - BearerAuth: []
      summary: Create uptime report
      tags:
      - Reports
  /health:
    get:
      description: Check if the report service is running
      produces:
      - application/json
      responses:
        "200":
          description: Service is running
          schema:
            $ref: '#/definitions/httpresponse.Response'
      summary: Health check
      tags:
      - Health
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"

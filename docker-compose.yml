services:
  # Reverse Proxy
  traefik:
    image: traefik:v3.5.2
    # container_name: sms_traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
      - "--providers.swarm.watch=true"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=sms_stack_sms-network"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - sms-network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)"
        - "traefik.http.routers.dashboard.service=api@internal"
        - "traefik.http.routers.dashboard.entrypoints=web"
        - "traefik.http.services.dashboard.loadbalancer.server.port=8080"
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 10s

  # Infrastructure Services
  postgres:
    image: postgres:16.10-alpine
    # container_name: sms_postgres
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: sms_db
    ports:
      - target: 5432
        published: 5432
        protocol: tcp
        mode: host
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sms-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 10s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    # container_name: sms_redis
    ports:
      - target: 6379
        published: 6379
        protocol: tcp
        mode: host
    volumes:
      - redis_data:/data
    networks:
      - sms-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 10s
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: bitnami/kafka:latest
    # container_name: sms_kafka
    ports:
      - target: 9092
        published: 9092
        protocol: tcp
        mode: host
    environment:
      KAFKA_KRAFT_MODE: "true"
      KAFKA_ENABLE_KRAFT: yes
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_DELETE_TOPIC_ENABLE: "true"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - sms-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 30s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.4
    # container_name: sms_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - target: 9200
        published: 9200
        protocol: tcp
        mode: host
      - target: 9300
        published: 9300
        protocol: tcp
        mode: host
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - sms-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 10s
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  logstash:
    image: docker.elastic.co/logstash/logstash:9.1.4
    # container_name: sms_logstash
    ports:
      - target: 5044
        published: 5044
        protocol: tcp
        mode: host
      - target: 9600
        published: 9600
        protocol: tcp
        mode: host
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    depends_on:
      - elasticsearch
    networks:
      - sms-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 10s

  filebeat:
    image: docker.elastic.co/beats/filebeat:9.1.4
    # container_name: sms_filebeat
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml
      - ./logs:/usr/share/filebeat/sms_logs
    depends_on:
      - logstash
    networks:
      - sms-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.4
    # container_name: sms_kibana
    ports:
      - target: 5601
        published: 5601
        protocol: tcp
        mode: host
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
    depends_on:
      - elasticsearch
    networks:
      - sms-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 30s

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.10.0
    # container_name: sms_jaeger
    ports:
      - target: 16686
        published: 16686
        protocol: tcp
        mode: host
      - target: 4317
        published: 4317
        protocol: tcp
        mode: host
      - target: 4318
        published: 4318
        protocol: tcp
        mode: host
      - target: 5778
        published: 5778
        protocol: tcp
        mode: host
      - target: 9411
        published: 9411
        protocol: tcp
        mode: host
    networks:
      - sms-network
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.jaeger.rule=Host(`jaeger.localhost`)"
        - "traefik.http.routers.jaeger.entrypoints=web"
        - "traefik.http.services.jaeger.loadbalancer.server.port=16686"
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 10s

  # Application Services
  user_service:
    image: vcs-sms-user_service:latest
    # container_name: sms_user_service
    entrypoint: ["/app/wait-for-service.sh"]
    environment:
      WAIT_FOR_SERVICES: "postgres:5432"
      COMMAND: "./user"
    depends_on:
      - postgres
      - jaeger
    ports:
      - "50001:50001" # gRPC port
    volumes:
      - ./user_service/config/config.yaml:/app/user_service/config/config.yaml
      - ./logs:/app/logs
      - ./wait-for-service.sh:/app/wait-for-service.sh
    networks:
      - sms-network
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.user-api.rule=Host(`user.localhost`)"
        - "traefik.http.routers.user-api.entrypoints=web"
        - "traefik.http.services.user-api.loadbalancer.server.port=8001"
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 10s

  auth_service:
    image: vcs-sms-auth_service:latest
    # container_name: sms_auth_service
    entrypoint: ["/app/wait-for-service.sh"]
    environment:
      WAIT_FOR_SERVICES: "redis:6379"
      COMMAND: "./auth"
    depends_on:
      - redis
      - jaeger
    volumes:
      - ./auth_service/config/config.yaml:/app/auth_service/config/config.yaml
      - ./logs:/app/logs
      - ./wait-for-service.sh:/app/wait-for-service.sh
    networks:
      - sms-network
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.auth-api.rule=Host(`auth.localhost`)"
        - "traefik.http.routers.auth-api.entrypoints=web"
        - "traefik.http.services.auth-api.loadbalancer.server.port=8003"
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 10s

  server_service:
    image: vcs-sms-server_service:latest
    # container_name: sms_server_service
    entrypoint: ["/app/wait-for-service.sh"]
    environment:
      WAIT_FOR_SERVICES: "postgres:5432 kafka:9092"
      COMMAND: "./server"
    depends_on:
      - postgres
      - kafka
      - jaeger
    volumes:
      - ./server_service/config/config.yaml:/app/server_service/config/config.yaml
      - ./logs:/app/logs
      - ./wait-for-service.sh:/app/wait-for-service.sh
    networks:
      - sms-network
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.server-api.rule=Host(`server.localhost`)"
        - "traefik.http.routers.server-api.entrypoints=web"
        - "traefik.http.services.server-api.loadbalancer.server.port=8000"
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 10s

  report_service:
    image: vcs-sms-report_service:latest
    # container_name: sms_report_service
    entrypoint: ["/app/wait-for-service.sh"]
    environment:
      WAIT_FOR_SERVICES: "elasticsearch:9200"
      COMMAND: "./report"
    depends_on:
      - elasticsearch
      - jaeger
    volumes:
      - ./report_service/config/config.yaml:/app/report_service/config/config.yaml
      - ./report_service/internal/templates/:/app/report_service/internal/templates/
      - ./logs:/app/logs
      - ./wait-for-service.sh:/app/wait-for-service.sh
    networks:
      - sms-network
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.report-api.rule=Host(`report.localhost`)"
        - "traefik.http.routers.report-api.entrypoints=web"
        - "traefik.http.services.report-api.loadbalancer.server.port=8002"
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 30s

  healthcheck_service:
    image: vcs-sms-healthcheck_service:latest
    # container_name: sms_healthcheck_service
    entrypoint: ["/app/wait-for-service.sh"]
    environment:
      WAIT_FOR_SERVICES: "elasticsearch:9200 redis:6379 kafka:9092"
      COMMAND: "./healthcheck"
    depends_on:
      - elasticsearch
      - redis
      - kafka
      - jaeger
    volumes:
      - ./healthcheck_service/config/config.yaml:/app/healthcheck_service/config/config.yaml
      - ./logs:/app/logs
      - ./wait-for-service.sh:/app/wait-for-service.sh
    networks:
      - sms-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 30s
    # No Traefik labels as this is a background service

networks:
  sms-network:
    driver: overlay

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local
  kafka_data:
    driver: local

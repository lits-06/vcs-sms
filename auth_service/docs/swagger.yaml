definitions:
  github_com_lits-06_vcs-sms_auth_service_internal_dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  github_com_lits-06_vcs-sms_auth_service_internal_dto.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  httpresponse.Response:
    properties:
      data: {}
      message:
        type: string
    type: object
host: auth.localhost
info:
  contact: {}
  description: This is the Auth Service API for VCS-SMS system
  title: Auth Service API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Login user with email and password
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_lits-06_vcs-sms_auth_service_internal_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User logged in successfully
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "500":
          description: Failed to login
          schema:
            $ref: '#/definitions/httpresponse.Response'
      summary: Login user
      tags:
      - Auth
  /api/auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh access token using refresh token
      parameters:
      - description: Refresh token request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_lits-06_vcs-sms_auth_service_internal_dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Access token refreshed successfully
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/httpresponse.Response'
        "500":
          description: Failed to refresh access token
          schema:
            $ref: '#/definitions/httpresponse.Response'
      summary: Refresh access token
      tags:
      - Auth
  /health:
    get:
      description: Check if the auth service is running
      produces:
      - application/json
      responses:
        "200":
          description: Service is running
          schema:
            $ref: '#/definitions/httpresponse.Response'
      summary: Health check
      tags:
      - Health
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"

input {
  beats {
    port => 5044
  }
}

filter {
  grok {
    match => { "log.file.path" => "/var/log/sms_logs/%{GREEDYDATA:service_name}.log" }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "sms-logs-%{service_name}-%{+YYYY.MM.dd}"
  }

  stdout { codec => rubydebug }
}